<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>车机桌面</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;color:#fff;font:14px sans-serif;touch-action:none;background:#122138}
#desktop-hint{position:absolute;inset:0;display:grid;place-items:center;color:#dce9fa99;font-size:20px;pointer-events:none}#desktop{position:absolute;inset:0 0 58px;overflow:hidden;background:radial-gradient(ellipse at 70% 10%,#375a81,#172b49 58%,#101b2d)}
#icons{position:absolute;inset:12px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));grid-auto-rows:90px;align-content:start;overflow:auto;touch-action:pan-y}
button{border:1px solid #ffffff30;background:#26374c;color:#fff;border-radius:7px;padding:6px 10px;font:14px sans-serif}
.icon{border:0;background:transparent;width:80px;height:82px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:3px;font-size:12px;overflow:hidden;text-shadow:0 1px 4px #000}.icon b{display:grid;place-items:center;background:linear-gradient(135deg,#60a5fa,#4560b4);border-radius:14px;width:46px;height:46px;font-size:22px;box-shadow:0 2px 10px #0006}.icon span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#toolbar{position:absolute;bottom:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:5px;padding:5px 8px;background:#152236f5;z-index:100000}#toolbar button{height:46px;min-width:54px;white-space:nowrap}#message{font-size:12px;white-space:nowrap;color:#d6e4f5;overflow:hidden;text-overflow:ellipsis;flex:1}#tasks{display:flex;gap:5px;min-width:0}#tasks button{max-width:120px;overflow:hidden;text-overflow:ellipsis}.active-task{background:#416c9a;border-color:#b2d4ff}
#drawer{position:absolute;inset:10px 10px 68px;z-index:90000;background:#17273bf7;border:1px solid #ffffff44;border-radius:12px;box-shadow:0 8px 32px #000a;display:flex;flex-direction:column}#drawer[hidden],#options[hidden],#choose[hidden]{display:none!important}#drawer header{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:18px}#drawer header button{margin-left:auto;min-height:44px}#drawer .list{position:relative;flex:1;min-height:0}#choose{padding:12px;background:#29415c;display:flex;align-items:center;gap:8px;flex-wrap:wrap}#choose button{min-height:44px}#options{position:absolute;right:8px;bottom:64px;z-index:99999;padding:10px;background:#17273bf5;border:1px solid #ffffff44;border-radius:10px;display:flex;gap:8px;flex-wrap:wrap;max-width:90%}#options button{min-height:44px}
.window{position:absolute;top:8%;height:72%;width:48%;background:#000;border:1px solid #71839c;border-radius:8px;display:flex;flex-direction:column;min-width:160px;min-height:130px;overflow:hidden;box-shadow:0 8px 28px #0009}.window[hidden]{display:none!important}
#left{left:4%}#right{left:46%;top:14%}.bar{height:48px;flex:none;background:#24364b;padding:4px;cursor:move;touch-action:none;display:flex;align-items:center;gap:5px}.bar .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.bar .fps{color:#bed0e3;font-size:11px}.bar button{min-width:44px;min-height:40px;padding:3px 8px;font-size:17px}
canvas{display:block;width:100%;height:100%;object-fit:contain;touch-action:none}.screen{flex:1;min-height:0;position:relative}.resize{position:absolute;right:0;bottom:0;width:27px;height:27px;touch-action:none;cursor:nwse-resize;background:linear-gradient(135deg,transparent 45%,#aab9c9 46%,#aab9c9 50%,transparent 51%,transparent 62%,#aab9c9 63%,#aab9c9 68%,transparent 69%)}
</style></head><body><div id="desktop"><div id="desktop-hint">点击底部「应用」打开应用</div><section class="window" id="left" hidden><div class="bar"><button class="back">‹</button><strong class="title">应用</strong><span class="fps">等待画面</span><button class="min" title="最小化">—</button><button class="max" title="最大化">□</button><button class="close" title="关闭窗口">×</button></div><div class="screen"><canvas></canvas></div><div class="resize"></div></section><section class="window" id="right" hidden><div class="bar"><button class="back">‹</button><strong class="title">应用</strong><span class="fps">等待画面</span><button class="min" title="最小化">—</button><button class="max" title="最大化">□</button><button class="close" title="关闭窗口">×</button></div><div class="screen"><canvas></canvas></div><div class="resize"></div></section></div>
<div id="drawer"><header>应用列表 <button id="dismiss">关闭</button></header><div id="choose" hidden><span>两个窗口都在使用，请选择要替换的窗口：</span><button id="replace-left"></button><button id="replace-right"></button><button id="cancel-replace">取消</button></div><div class="list"><div id="icons"></div></div></div>
<div id="options" hidden><button id="reset">并排显示</button><button id="audio">开启车机声音</button><button id="full">全屏</button><button id="disconnect">断开连接</button></div>
<div id="toolbar"><button id="back">返回</button><button id="home">桌面</button><button id="apps">应用</button><div id="tasks"><button class="task" id="task-left" hidden></button><button class="task" id="task-right" hidden></button></div><span id="message">正在连接</span><button id="more">更多</button></div>
<script>
const key = new URLSearchParams(location.search).get('key') || '';
const suffix = '?key=' + encodeURIComponent(key);
const wsPrefix = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
const desktop = document.getElementById('desktop'), message = document.getElementById('message');
let stack = 2, focused = null, pendingApp = null;
const drawer=document.getElementById('drawer'), chooser=document.getElementById('choose');
function focusWindow(w){focused=w;w.hidden=false;w.style.zIndex=++stack;for(const id of ['left','right']){const task=document.getElementById('task-'+id);task.className='task'+(w.id===id?' active-task':'')}}
function showApps(){pendingApp=null;chooser.hidden=true;drawer.hidden=false;document.getElementById('options').hidden=true;}
function showDesktop(){drawer.hidden=true;chooser.hidden=true;document.getElementById('options').hidden=true;for(const w of document.querySelectorAll('.window'))w.hidden=true;focused=null;for(const id of ['left','right'])document.getElementById('task-'+id).className='task'}
function bounded(v, min, max){ return Math.max(min, Math.min(max, v)); }
function resetWindows(){ for(const [i,w] of [...document.querySelectorAll('.window')].entries()){ w.style.left=(i*50)+'%';w.style.top='0';w.style.width='50%';w.style.height='100%'; w.dataset.max=''; } }
document.getElementById('reset').onclick = ()=>{resetWindows();document.getElementById('options').hidden=true};
for(const w of document.querySelectorAll('.window')){
  w.addEventListener('pointerdown',()=>focusWindow(w));
  function movement(handle, resize){ handle.addEventListener('pointerdown',e=>{e.preventDefault();handle.setPointerCapture(e.pointerId);const box=w.getBoundingClientRect(), area=desktop.getBoundingClientRect(), x=e.clientX,y=e.clientY;
    const initial={left:box.left-area.left,top:box.top-area.top,width:box.width,height:box.height};
    const move=ev=>{const dx=ev.clientX-x,dy=ev.clientY-y;if(resize){w.style.width=bounded(initial.width+dx,160,area.width-initial.left)+'px';w.style.height=bounded(initial.height+dy,130,area.height-initial.top)+'px';}else{w.style.left=bounded(initial.left+dx,0,area.width-initial.width)+'px';w.style.top=bounded(initial.top+dy,0,area.height-initial.height)+'px';}};
    const end=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',end);handle.removeEventListener('pointercancel',end);};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);
  });}
  movement(w.querySelector('.bar'),false);movement(w.querySelector('.resize'),true);
  for(const button of w.querySelectorAll('.bar button')) for(const name of ['pointerdown','pointerup','pointermove']) button.addEventListener(name,e=>e.stopPropagation());
  w.querySelector('.min').onclick=()=>{w.hidden=true;if(focused===w)focused=null;document.getElementById('task-'+w.id).className='task'};
  w.querySelector('.close').onclick=()=>{w.hidden=true;w.dataset.component='';if(focused===w)focused=null;const task=document.getElementById('task-'+w.id);task.hidden=true;task.className='task'};
  w.querySelector('.max').onclick=()=>{if(w.dataset.max){Object.assign(w.style,JSON.parse(w.dataset.max));w.dataset.max=''}else{w.dataset.max=JSON.stringify({left:w.style.left,top:w.style.top,width:w.style.width,height:w.style.height});Object.assign(w.style,{left:'0',top:'0',width:'100%',height:'100%'})}};

}
function player(id,path){
  const w=document.getElementById(id), canvas=w.querySelector('canvas'), ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
  let decoder,configured=false,waiting=true,config=null,codec='',timestamp=0,ws,active=null,frames=0;
  const label=w.querySelector('.fps');setInterval(()=>{ label.textContent=(canvas.width&&canvas.height?canvas.width+'×'+canvas.height+' · ':'')+frames+' 帧/秒';frames=0; },1000);
  const hex=x=>('0'+x.toString(16)).slice(-2).toUpperCase();
  function init(){if(decoder)try{decoder.close()}catch(e){};configured=false;waiting=true;decoder=new VideoDecoder({output(frame){if(canvas.width!==frame.displayWidth||canvas.height!==frame.displayHeight){canvas.width=frame.displayWidth;canvas.height=frame.displayHeight}ctx.drawImage(frame,0,0);frame.close();frames++;},error(){init();if(codec)try{decoder.configure({codec,optimizeForLatency:true,hardwareAcceleration:'prefer-hardware'});configured=true}catch(e){}}});}
  function connect(){init();ws=new WebSocket(wsPrefix+path+suffix);ws.binaryType='arraybuffer';ws.onopen=()=>{message.textContent='已连接';};ws.onclose=()=>{message.textContent='连接中断，正在重试';setTimeout(connect,1500)};
    ws.onmessage=e=>{if(typeof e.data==='string'){try{const info=JSON.parse(e.data);if(info.status)message.textContent=info.status}catch(err){}return}const bytes=new Uint8Array(e.data);if(bytes.length<3)return;const isKey=bytes[0]===1,isConfig=bytes[1]===1,payload=bytes.subarray(2);
      if(isConfig){config=payload;for(let i=0;i<payload.length-7;i++){if(payload[i]===0&&payload[i+1]===0&&(payload[i+2]===1||(payload[i+2]===0&&payload[i+3]===1))){const p=payload[i+2]===1?i+3:i+4;if((payload[p]&31)===7){codec='avc1.'+hex(payload[p+1])+hex(payload[p+2])+hex(payload[p+3]);try{decoder.configure({codec,optimizeForLatency:true,hardwareAcceleration:'prefer-hardware'});configured=true;waiting=true}catch(err){label.textContent='视频解码不支持'}break}}}return;}
      if(!configured)return;if(decoder.decodeQueueSize>6){try{decoder.reset();decoder.configure({codec,optimizeForLatency:true,hardwareAcceleration:'prefer-hardware'})}catch(err){}waiting=true;}
      if(waiting&&!isKey)return;if(isKey)waiting=false;try{timestamp=Math.max(timestamp+1,Math.round(performance.now()*1000));if(isKey&&config){const data=new Uint8Array(config.length+payload.length);data.set(config);data.set(payload,config.length);decoder.decode(new EncodedVideoChunk({type:'key',timestamp,data}));}else decoder.decode(new EncodedVideoChunk({type:isKey?'key':'delta',timestamp,data:payload}));}catch(err){waiting=true;}
    };
  }
  if(!window.VideoDecoder){label.textContent='浏览器不支持视频解码';return}connect();
  const back=w.querySelector('.back');
  for(const name of ['pointerdown','pointerup','pointermove'])back.addEventListener(name,e=>e.stopPropagation());
  back.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({action:'back'}));});
  function touch(action,e){if(!ws||ws.readyState!==WebSocket.OPEN||!canvas.width||!canvas.height)return false;const r=canvas.getBoundingClientRect(),scale=Math.min(r.width/canvas.width,r.height/canvas.height);if(!scale)return false;const ox=r.left+(r.width-canvas.width*scale)/2,oy=r.top+(r.height-canvas.height*scale)/2;
    const rawX=(e.clientX-ox)/scale,rawY=(e.clientY-oy)/scale;if(action===0&&(rawX<0||rawY<0||rawX>=canvas.width||rawY>=canvas.height))return false;
    const x=bounded(Math.round(rawX),0,canvas.width-1),y=bounded(Math.round(rawY),0,canvas.height-1),data=new ArrayBuffer(22),v=new DataView(data);v.setUint8(0,2);v.setUint8(1,action);v.setBigInt64(2,0n);v.setInt32(10,x);v.setInt32(14,y);v.setUint16(18,canvas.width);v.setUint16(20,canvas.height);ws.send(data);return true;
  }
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(active!==null||!touch(0,e))return;active=e.pointerId;try{canvas.setPointerCapture(e.pointerId)}catch(err){}});
  canvas.addEventListener('pointermove',e=>{if(active===e.pointerId)touch(2,e)});
  for(const name of ['pointerup','pointercancel'])canvas.addEventListener(name,e=>{if(active===e.pointerId){touch(1,e);active=null}});
  return ()=>ws;
}
const left=player('left','/stream'), right=player('right','/stream2');
document.getElementById('home').onclick=showDesktop;
document.getElementById('apps').onclick=showApps;
document.getElementById('dismiss').onclick=()=>{drawer.hidden=true;chooser.hidden=true};
document.getElementById('more').onclick=()=>{const menu=document.getElementById('options');menu.hidden=!menu.hidden};
document.getElementById('back').onclick=()=>{if(!drawer.hidden){drawer.hidden=true;chooser.hidden=true;return}if(focused&&!focused.hidden)focused.querySelector('.back').click();else message.textContent='请先选择一个应用窗口'};
document.getElementById('cancel-replace').onclick=()=>{pendingApp=null;chooser.hidden=true};
function launchIn(w,app){
 const socket=(w.id==='left'?left:right), ws=socket&&socket();
 if(!ws||ws.readyState!==WebSocket.OPEN){message.textContent='桌面正在连接，请稍后重试';return;}
 w.dataset.component=app.component;w.querySelector('.title').textContent=app.name;
 const task=document.getElementById('task-'+w.id);task.textContent=app.name;task.hidden=false;task.onclick=()=>{drawer.hidden=true;focusWindow(w)};
 drawer.hidden=true;chooser.hidden=true;pendingApp=null;focusWindow(w);message.textContent='正在打开 '+app.name;ws.send('launch:'+app.component);
}
for(const id of ['left','right'])document.getElementById('replace-'+id).onclick=()=>{if(pendingApp)launchIn(document.getElementById(id),pendingApp)};
function openApp(app){
 const windows=[document.getElementById('left'),document.getElementById('right')];
 const existing=windows.find(w=>w.dataset.component===app.component);
 if(existing){drawer.hidden=true;chooser.hidden=true;focusWindow(existing);return;}
 const free=windows.find(w=>!w.dataset.component);
 if(free){launchIn(free,app);return;}
 pendingApp=app;for(const w of windows)document.getElementById('replace-'+w.id).textContent='替换 '+w.querySelector('.title').textContent;
 chooser.hidden=false;message.textContent='请选择要替换的窗口';
}
fetch('/apps'+suffix,{cache:'no-store'}).then(response=>{if(!response.ok)throw Error('应用列表不可用');return response.json()}).then(apps=>{
 const icons=document.getElementById('icons');for(const app of apps){const button=document.createElement('button');button.className='icon';const tile=document.createElement('b');tile.textContent=(app.name||'?').slice(0,1);const name=document.createElement('span');name.textContent=app.name;button.appendChild(tile);button.appendChild(name);button.onclick=()=>openApp(app);icons.appendChild(button)}
 if(!apps.length)message.textContent='没有找到可启动的应用';
}).catch(()=>{message.textContent='应用列表读取失败，请刷新页面'});

document.getElementById('disconnect').onclick=()=>{const ws=left&&left();if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({action:'disconnect'}));};
document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});};
let audioContext=null,audioSocket=null;
document.getElementById('audio').onclick=async e=>{const button=e.currentTarget;if(audioContext){if(audioSocket)audioSocket.close();await audioContext.close();audioContext=null;audioSocket=null;button.textContent='开启车机声音';return;}
 try{audioContext=new AudioContext({sampleRate:48000,latencyHint:'interactive'});await audioContext.audioWorklet.addModule('/audio-worklet.js'+suffix);const node=new AudioWorkletNode(audioContext,'car-audio-player',{outputChannelCount:[2]});node.connect(audioContext.destination);await audioContext.resume();audioSocket=new WebSocket(wsPrefix+'/audio'+suffix);audioSocket.binaryType='arraybuffer';audioSocket.onmessage=ev=>{if(ev.data instanceof ArrayBuffer)node.port.postMessage(ev.data,[ev.data]);else{try{if(JSON.parse(ev.data).error)button.textContent='手机音频不可用'}catch(err){}}};audioSocket.onclose=()=>{if(audioContext)button.textContent='声音断开，请重试';};button.textContent='车机声音已开启';}catch(err){if(audioContext)await audioContext.close();audioContext=null;button.textContent='声音不可用，请重试';}
};
</script></body></html>
